name: Feature Request
description: Suggest an improvement to usability or supported environments
title: "[Request] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What's the problem
      description: Describe what workflow or limitation is causing you friction.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Your setup
      placeholder: "Windows, DAW, audio interface, OBS / Discord, etc."

  - type: checkboxes
    id: privacy
    attributes:
      label: Confirmation
      options:
        - label: I have only included information I am comfortable making public
          required: true
